name: CI

on:
  # Push só de documentação (docs/ e arquivos .md) não roda o CI (cliente, 05/nov/2026). O GitHub olha todos os
  # commits do push: com algum arquivo de código junto, roda.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      # As datas não podem depender do fuso do servidor (L40).
      - run: TZ=America/Los_Angeles npx vitest run src/lib/clinicTime.test.ts src/lib/data/agenda
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - run: npm ci
      # Só o necessário para os testes de banco: Postgres, Auth, PostgREST, Storage (logo da
      # clínica e XML da nota) e o gateway.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,postgres-meta,supavisor
      - run: npm run test:db
      # Os tipos do banco precisam estar em dia com as migrações (`npm run db:types`).
      - run: npm run db:types && git diff --exit-code src/lib/supabase/database.types.ts
