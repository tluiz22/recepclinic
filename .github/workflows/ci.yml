name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      # As datas não podem depender do fuso do servidor (L40).
      - run: TZ=America/Los_Angeles npx vitest run src/lib/clinicTime.test.ts
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - run: npm ci
      # Só o necessário para os testes de banco: Postgres, Auth, PostgREST e o gateway.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,mailpit,postgres-meta,supavisor
      - run: npm run test:db
      # Os tipos do banco precisam estar em dia com as migrações (`npm run db:types`).
      - run: npm run db:types && git diff --exit-code src/lib/supabase/database.types.ts
