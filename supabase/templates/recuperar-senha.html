<h2>Redefinir a senha do painel RecepClinic</h2>
<p>Recebemos um pedido para redefinir a sua senha. Para escolher uma nova senha:</p>
<p><a href="{{ .SiteURL }}/api/admin/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery">Redefinir minha senha</a></p>
<p>Se você não pediu, ignore esta mensagem: a senha atual continua valendo.</p>
